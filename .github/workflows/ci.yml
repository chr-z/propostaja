name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm ci
      - name: Rodar testes
        run: node --test tests/*.test.js
      - name: Garantir que nenhuma chave privada foi commitada
        run: |
          ! grep -r '"d"' keys/ 2>/dev/null || test ! -d keys
          echo "ok: sem chaves privadas no repo"
